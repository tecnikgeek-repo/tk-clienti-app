name: tkclienti
description: "tk-clienti per Android e iPhone: clienti, listino e preventivi, software libero AGPL-3.0."
publish_to: 'none'

# 3.0.0 = riscritta in Flutter (la versione Kotlin era la 2.9.2, build 35)
version: 3.2.3+43

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  http: ^1.6.0
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  pdf: ^3.11.3
  archive: ^4.0.7
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    # font del PDF dei preventivi (il font interno dei PDF non ha il simbolo €)
    - assets/font/Roboto-Regular.ttf
    - assets/font/Roboto-Bold.ttf
    - assets/licenze/COPYING-AGPL-3.0.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icona.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icona-adattiva.png
  remove_alpha_ios: true
